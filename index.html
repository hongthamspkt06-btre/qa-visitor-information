<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QA VISITOR INFORMATION</title>
<style>
  :root{
    --navy:#1B3A63;
    --green:#1E8E5A;
    --green-hover:#187a4d;
    --bg:#D5D8DC;
    --white:#FFFFFF;
    --border:#C3C8CE;
    --text:#232A31;
    --text-muted:#5C6670;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0;
    padding:0;
    background:var(--bg);
    font-family:"Segoe UI","Malgun Gothic",Arial,sans-serif;
    color:var(--text);
    font-size:12px;
  }

  body *{
    font-family:inherit;
  }

  .page{
    padding-top:4.76mm;
    padding-left:4.76mm;
    padding-right:4.76mm;
    padding-bottom:4.76mm;
    max-width:1221.6px;
    margin:0 auto;
  }

  /* Header */
  .header-bar{
    height:15mm;
    background:var(--navy);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    color:var(--white);
  }

  .header-title{
    font-size:19px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }

  .btn-export{
    height:9.4mm;
    background:var(--green);
    color:var(--white);
    border:none;
    border-radius:4px;
    font-size:13px;
    font-weight:700;
    padding:0 18px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    transition:background 0.15s ease;
  }

  .btn-export:hover{
    background:var(--green-hover);
  }

  .btn-export:active{
    transform:translateY(1px);
  }

  .btn-export svg{
    width:14px;
    height:14px;
    flex:none;
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:8px;
    margin-top:4.76mm;
  }

  .tab-btn{
    font-size:14px;
    font-weight:600;
    background:var(--white);
    color:var(--text);
    border:1px solid #C9CDD2;
    padding:9px 22px;
    cursor:pointer;
    border-radius:6px;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .tab-btn:hover:not(.active){
    background:#F2F3F5;
  }

  .tab-btn.active{
    color:var(--white);
    background:var(--navy);
    border-color:var(--navy);
    font-weight:700;
  }

  .tab-panel{
    display:none;
  }

  .tab-panel.active{
    display:block;
  }

  /* Summary tab */
  .summary-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
  .summary-filters{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .summary-filter{ display:flex; align-items:center; gap:8px; font-size:12px; font-weight:600; }
  .summary-filter select{
    font-size:12px; padding:6px 8px; width:100px; color:var(--text);
    background:var(--white); border:1px solid #C9CDD2; border-radius:4px; outline:none;
  }
  .summary-filter select:focus{ border-color:var(--navy); }
  .summary-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .chart-card{ border:1px solid var(--border); border-radius:4px; padding:10px 12px; min-width:0; }
  .chart-title{ font-size:12px; font-weight:700; color:var(--text-muted); margin-bottom:6px; }
  .chart-total{ color:var(--green); font-size:13px; font-weight:700; }
  .chart-body svg{ display:block; width:100%; height:auto; }
  .chart-empty{ padding:70px 0; text-align:center; color:var(--text-muted); }
  .pie-wrap{ display:flex; justify-content:center; }
  .pie-wrap svg{ width:100%; max-width:440px; }
  .summary-note{ margin-top:8px; font-size:11px; color:var(--text-muted); }
  .summary-note:empty{ display:none; }
  @media (max-width:760px){ .summary-grid{ grid-template-columns:1fr; } }

  /* Blocks */
  .block{
    background:var(--white);
    border-radius:4px;
    border:1px solid var(--border);
    margin-top:4.76mm;
    padding:16px;
  }

  .block-title{
    font-size:14px;
    font-weight:700;
    color:var(--navy);
    margin:0;
  }

  #entry-block{
    padding:10px 16px;
  }

  .entry-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:8px;
  }

  .field-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:8px 10px;
  }

  .field{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
  }

  .field label{
    font-size:11px;
    font-weight:600;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .field input[type="date"],
  .field input[type="text"],
  .field select,
  .field textarea{
    font-family:inherit;
    font-size:12px;
    color:var(--text);
    background:var(--white);
    border:1px solid #C9CDD2;
    border-radius:4px;
    padding:6px 8px;
    outline:none;
    transition:border-color 0.15s ease;
    width:100%;
    min-width:0;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus{
    border-color:var(--navy);
  }

  .field textarea{
    resize:vertical;
    min-height:30px;
    height:30px;
  }

  .time-input-row{
    display:flex;
    gap:5px;
  }

  .time-input-row input[type="text"]{
    flex:1;
    min-width:0;
  }

  .time-input-row select{
    width:58px;
    flex:none;
    font-size:12px;
    padding:6px 4px;
    border:1px solid #C9CDD2;
    border-radius:4px;
    background:var(--white);
  }

  .btn-add{
    height:9.4mm;
    background:#3B7DDE;
    color:var(--white);
    border:none;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
    padding:0 18px;
    cursor:pointer;
    flex:none;
  }

  .btn-add:hover{
    background:#2E68C4;
  }

  .entry-list-empty{
    font-size:12px;
    color:var(--text-muted);
    padding:8px 0;
  }

  /* Entry List block: grows with data, capped at 3x the height of the Entry block (set by JS) */
  #entry-list-block{
    display:flex;
    flex-direction:column;
    max-height:var(--entry-list-max, none);
  }

  #entryListContainer{
    display:flex;
    flex-direction:column;
    flex:0 1 auto;
    min-height:0;
    margin-top:10px;
  }

  /* Vertical scroll only; no horizontal scroll */
  .entry-table-wrap{
    flex:0 1 auto;
    min-height:0;
    overflow-x:hidden;
    overflow-y:auto;
    border:1px solid var(--border);
    border-radius:4px;
  }

  table.entry-table{
    width:100%;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:0;
    font-size:12px;
  }

  table.entry-table th,
  table.entry-table td{
    text-align:center;
    vertical-align:middle;
    padding:8px 6px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    white-space:normal;
    overflow-wrap:anywhere;
    background:var(--white);
  }

  table.entry-table th:last-child,
  table.entry-table td:last-child{
    border-right:none;
    padding-left:2px;
    padding-right:2px;
  }

  table.entry-table tbody tr:last-child td{
    border-bottom:none;
  }

  /* Fixed data-row height = 2 lines of text; longer text is cut with an ellipsis (full text on hover) */
  table.entry-table tbody td{
    height:49px;
  }

  .cell-text{
    line-height:16px;
    max-height:32px;
    overflow:hidden;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    line-clamp:2;
  }

  table.entry-table tbody tr.cancelled td:not(:first-child):not(:last-child) .cell-text{
    text-decoration:line-through;
  }

  /* Sticky header row while scrolling vertically */
  table.entry-table thead th{
    position:sticky;
    top:0;
    z-index:2;
    color:var(--navy);
    background:#DCE9F8;
    font-weight:700;
  }

  table.entry-table tbody tr:hover td{
    background:#F2F4F6;
  }

  .row-actions{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
  }

  .row-delete,
  .row-edit{
    width:18px;
    height:18px;
    padding:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:var(--white);
    border-radius:4px;
    cursor:pointer;
    line-height:1;
  }

  .row-delete{
    border:1px solid #E74C3C;
    color:#E74C3C;
    font-size:11px;
    font-weight:700;
  }

  .row-delete:hover{
    background:#FDEDEC;
  }

  .row-edit{
    border:1px solid var(--green);
    color:var(--green);
  }

  .row-edit:hover{
    background:#E6F5ED;
  }

  .row-edit svg{
    width:10px;
    height:10px;
    pointer-events:none;
  }

  /* Cells changed by a revision (highlight ends at 23:59 of the update day) */
  table.entry-table tbody tr td.changed{
    background:#DDF1E4;
  }

  table.entry-table tbody tr:hover td.changed{
    background:#CDE9D7;
  }

  /* Revised with Remark = "Cancel": strike through all data cells of the row */
  table.entry-table tbody tr.cancelled td:not(:first-child):not(:last-child){
    text-decoration:line-through;
    color:var(--text-muted);
  }

  /* Revising indicator in Entry block */
  .entry-title-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }

  .revising-note{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--green);
    font-weight:600;
  }

  .revising-note[hidden]{
    display:none;
  }

  .revising-cancel{
    border:1px solid var(--border);
    background:var(--white);
    color:var(--text-muted);
    border-radius:4px;
    font-size:11px;
    padding:2px 8px;
    cursor:pointer;
  }

  .revising-cancel:hover{
    background:#F2F3F5;
  }

  /* Entry List header + search */
  .list-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .list-search{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .search-item{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; }
  .search-item input,
  .search-item select{
    font-family:inherit; font-size:12px; font-weight:400; color:var(--text);
    background:var(--white); border:1px solid #C9CDD2; border-radius:4px;
    padding:5px 8px; outline:none;
  }
  .search-item input{ width:132px; }
  .search-item select{ width:120px; }
  .search-item input:focus,
  .search-item select:focus{ border-color:var(--navy); }
  .search-clear{
    border:1px solid var(--border); background:var(--white); color:var(--text-muted);
    border-radius:4px; font-size:12px; padding:5px 10px; cursor:pointer;
  }
  .search-clear:hover{ background:#F2F3F5; }

  /* Toast */
  .toast{
    position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%);
    background:var(--navy); color:var(--white); padding:9px 16px; border-radius:6px;
    font-size:12px; font-weight:600; z-index:200; max-width:90vw; box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .toast[hidden]{ display:none; }
  .toast.error{ background:#C0392B; }

  /* Confirm dialog */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,30,45,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:16px;
  }

  .modal-overlay[hidden]{
    display:none;
  }

  .modal-card{
    background:var(--white);
    border-radius:8px;
    border:1px solid var(--border);
    box-shadow:0 8px 28px rgba(0,0,0,0.25);
    padding:20px 24px;
    min-width:280px;
    max-width:100%;
    text-align:center;
  }

  .modal-message{
    font-size:14px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:16px;
  }

  .modal-actions{
    display:flex;
    justify-content:center;
    gap:10px;
  }

  .modal-actions button{
    min-width:84px;
    height:32px;
    border-radius:6px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  .btn-yes{
    background:var(--navy);
    color:var(--white);
    border:1px solid var(--navy);
  }

  .btn-yes:hover{
    background:#142c4d;
  }

  .btn-no{
    background:var(--white);
    color:var(--text);
    border:1px solid #C9CDD2;
  }

  .btn-no:hover{
    background:#F2F3F5;
  }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<div class="page">

  <!-- Header -->
  <div class="header-bar">
    <div class="header-title">QA Visitor Information</div>
    <button class="btn-export" id="exportBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3v12m0 0-4-4m4 4 4-4M5 19h14" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Export Excel
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="information" type="button">Information</button>
    <button class="tab-btn" data-tab="summary" type="button">Summary</button>
  </div>

  <!-- Information tab -->
  <div class="tab-panel active" id="tab-information">
    <div class="block" id="entry-block">
      <div class="entry-header">
        <div class="entry-title-wrap">
          <div class="block-title">Entry</div>
          <span class="revising-note" id="revisingNote" hidden>
            <span id="revisingText"></span>
            <button class="revising-cancel" id="revisingCancel" type="button">Cancel</button>
          </span>
        </div>
        <button class="btn-add" id="addEntryBtn" type="button">+ Add</button>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="fromDate">From</label>
          <input type="date" id="fromDate">
        </div>

        <div class="field">
          <label for="toDate">To</label>
          <input type="date" id="toDate">
        </div>

        <div class="field">
          <label for="timeInput">Time</label>
          <div class="time-input-row">
            <input type="text" id="timeInput" placeholder="HH:MM" inputmode="numeric" maxlength="5">
            <select id="ampmSelect">
              <option>AM</option>
              <option>PM</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="visitorName">Visitor Name</label>
          <input type="text" id="visitorName" placeholder="Enter visitor name">
        </div>

        <div class="field">
          <label for="companyBuyer">Company/ Buyer</label>
          <input type="text" id="companyBuyer" placeholder="Enter company or buyer">
        </div>

        <div class="field">
          <label for="factoryDept">Factory/Dept.</label>
          <select id="factoryDept">
            <option value="">Select</option>
            <option>Factory 1</option>
            <option>Factory 2</option>
            <option>Factory 3</option>
            <option>Factory 4</option>
            <option>Factory 6</option>
            <option>Factory 7</option>
            <option>Main Office</option>
            <option>Main Warehouse</option>
          </select>
        </div>

        <div class="field">
          <label for="usvStaff">USV Staff In Charge</label>
          <select id="usvStaff">
            <option value="">Select</option>
            <option>Jenny-Trúc (7690)</option>
            <option>Jessica-Ly (7728)</option>
            <option>Kayla-Vân (-)</option>
            <option>Sunshine-Thảo (-)</option>
            <option>Lan (-)</option>
            <option>Sky-Huyền (7758)</option>
            <option>Mini-Tú (7758)</option>
            <option>Mint-Hạ (7758)</option>
            <option>Hari-Trúc (7783)</option>
            <option>Amber-Hà (5841)</option>
            <option>Peony-Châu (5876)</option>
            <option>Tham-Thắm (7726)</option>
            <option>Charlie-Hiếu (7734)</option>
          </select>
        </div>

        <div class="field">
          <label for="foreignerManager">Foreigner Manager</label>
          <select id="foreignerManager">
            <option value="">Select</option>
            <option>Mr.Kim Joo Shik</option>
            <option>Mr.Kim Jong Hyun</option>
            <option>Mr.Kim Da Vin</option>
            <option>Ms.Rosana</option>
            <option>Ms.Joyce</option>
          </select>
        </div>

        <div class="field">
          <label for="purpose">Purpose of Visit</label>
          <input type="text" id="purpose" placeholder="Enter purpose of visit">
        </div>

        <div class="field">
          <label for="remark">Remark</label>
          <textarea id="remark" placeholder="Enter remark"></textarea>
        </div>
      </div>
    </div>

    <div class="block" id="entry-list-block">
      <div class="list-header">
        <div class="block-title">Entry List</div>
        <div class="list-search">
          <div class="search-item"><label for="searchFrom">From</label><input type="date" id="searchFrom"></div>
          <div class="search-item"><label for="searchTo">To</label><input type="date" id="searchTo"></div>
          <div class="search-item"><label for="searchTeam">Team</label><select id="searchTeam"></select></div>
          <div class="search-item"><label for="searchFactory">Factory/Dept</label><select id="searchFactory"></select></div>
          <button class="search-clear" id="searchClear" type="button">Clear</button>
        </div>
      </div>
      <div id="entryListContainer">
        <div class="entry-list-empty" id="entryListEmpty">No entries yet.</div>
      </div>
    </div>
  </div>

  <!-- Summary tab -->
  <div class="tab-panel" id="tab-summary">
    <div class="block">
      <div class="summary-header">
        <div class="block-title">Weekly Visit</div>
        <div class="summary-filters">
          <div class="summary-filter"><label for="weekYearSelect">Year</label><select id="weekYearSelect"></select></div>
          <div class="summary-filter"><label for="weekSelect">Week</label><select id="weekSelect"></select></div>
        </div>
      </div>
      <div class="summary-grid">
        <div class="chart-card"><div class="chart-title" id="weekBarTitle">Visit</div><div class="chart-body" id="weekBar"></div></div>
        <div class="chart-card"><div class="chart-title">Weekly Portion</div><div class="chart-body" id="weekPie"></div></div>
      </div>
      <div class="summary-note" id="weekNote"></div>
    </div>
    <div class="block">
      <div class="summary-header">
        <div class="block-title">Monthly Visit</div>
        <div class="summary-filters">
          <div class="summary-filter"><label for="monthYearSelect">Year</label><select id="monthYearSelect"></select></div>
          <div class="summary-filter"><label for="monthSelect">Month</label><select id="monthSelect"></select></div>
        </div>
      </div>
      <div class="summary-grid">
        <div class="chart-card"><div class="chart-title" id="monthBarTitle">Visit</div><div class="chart-body" id="monthBar"></div></div>
        <div class="chart-card"><div class="chart-title">Monthly Portion</div><div class="chart-body" id="monthPie"></div></div>
      </div>
      <div class="summary-note" id="monthNote"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast" hidden></div>

<div class="modal-overlay" id="confirmOverlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmMessage">
    <div class="modal-message" id="confirmMessage"></div>
    <div class="modal-actions">
      <button class="btn-yes" id="confirmYes" type="button">Yes</button>
      <button class="btn-no" id="confirmNo" type="button">No</button>
    </div>
  </div>
</div>

<script>
  const tabButtons = document.querySelectorAll('.tab-btn');
  const tabPanels = {
    information: document.getElementById('tab-information'),
    summary: document.getElementById('tab-summary')
  };

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      Object.values(tabPanels).forEach(p => p.classList.remove('active'));
      tabPanels[btn.dataset.tab].classList.add('active');
    });
  });

  // Time field: auto-format HH:MM as the user types, AM/PM via dropdown
  const timeInputEl = document.getElementById('timeInput');
  const ampmSelectEl = document.getElementById('ampmSelect');

  timeInputEl.addEventListener('input', () => {
    let digits = timeInputEl.value.replace(/\D/g, '').slice(0, 4);
    if(digits.length >= 3){
      timeInputEl.value = digits.slice(0, 2) + ':' + digits.slice(2);
    } else {
      timeInputEl.value = digits;
    }
  });

  timeInputEl.addEventListener('blur', () => {
    const digits = timeInputEl.value.replace(/\D/g, '');
    if(digits.length === 0){
      timeInputEl.value = '';
      return;
    }
    let hourRaw = parseInt(digits.slice(0, 2), 10);
    if(isNaN(hourRaw)) hourRaw = 0;
    if(hourRaw > 23) hourRaw = 23;
    let m = parseInt(digits.slice(2, 4), 10) || 0;
    if(m > 59) m = 59;

    let hour12, ampm;
    if(hourRaw === 0){
      hour12 = 12; ampm = 'AM';
    } else if(hourRaw <= 11){
      hour12 = hourRaw; ampm = 'AM';
    } else if(hourRaw === 12){
      hour12 = 12; ampm = 'PM';
    } else {
      hour12 = hourRaw - 12; ampm = 'PM';
    }

    timeInputEl.value = String(hour12).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    ampmSelectEl.value = ampm;
  });

  // Entry List state
  const entries = [];
  const entryListContainer = document.getElementById('entryListContainer');
  const columns = [
    { key: 'from', label: 'From' },
    { key: 'to', label: 'To' },
    { key: 'time', label: 'Time' },
    { key: 'visitorName', label: 'Visitor Name' },
    { key: 'companyBuyer', label: 'Company/ Buyer' },
    { key: 'factoryDept', label: 'Factory/Dept.' },
    { key: 'usvStaff', label: 'USV Staff In Charge' },
    { key: 'foreignerManager', label: 'Foreigner Manager' },
    { key: 'purpose', label: 'Purpose of Visit' },
    { key: 'remark', label: 'Remark' }
  ];

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  let nextEntryId = 1;
  let editingId = null;

  function pad2(n){ return String(n).padStart(2, '0'); }

  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  const PENCIL_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>';

  function fmtYmdSlash(str){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
    return m ? `${m[1]}/${m[2]}/${m[3]}` : (str || '');
  }

  // ---- Search (From / To date pickers + USV Staff In Charge); each condition is optional ----
  const searchFrom = document.getElementById('searchFrom');
  const searchTo = document.getElementById('searchTo');
  const searchTeam = document.getElementById('searchTeam');       // options are filled with the Summary buyer list (see end of script)
  const searchFactory = document.getElementById('searchFactory');
  searchFactory.innerHTML = '<option value="">All</option>' +
    Array.from(document.getElementById('factoryDept').options)
      .filter(o => o.value !== '')
      .map(o => `<option>${escapeHtml(o.textContent)}</option>`).join('');

  // A row matches when its visit dates (From..To) overlap the searched range,
  // its USV Staff belongs to the chosen Team (same mapping as the Summary tab) and Factory/Dept is equal
  function entryMatchesSearch(e){
    const sf = searchFrom.value, st = searchTo.value, team = searchTeam.value, fac = searchFactory.value;
    if(team && STAFF_TO_BUYER[normKey(e.usvStaff)] !== team) return false;
    if(fac && e.factoryDept !== fac) return false;
    const start = e.from || e.to || '', end = e.to || e.from || '';
    if(sf && (!end || end < sf)) return false;
    if(st && (!start || start > st)) return false;
    return true;
  }

  [searchFrom, searchTo, searchTeam, searchFactory].forEach(el => el.addEventListener('change', () => renderEntryList()));
  document.getElementById('searchClear').addEventListener('click', () => {
    searchFrom.value = '';
    searchTo.value = '';
    searchTeam.value = '';
    searchFactory.value = '';
    renderEntryList();
  });

  function renderEntryList(){
    if(entries.length === 0){
      entryListContainer.innerHTML = '<div class="entry-list-empty" id="entryListEmpty">No entries yet.</div>';
      return;
    }

    if(!entries.some(entryMatchesSearch)){
      entryListContainer.innerHTML = '<div class="entry-list-empty">No entries match the search.</div>';
      return;
    }

    const prevWrap = entryListContainer.querySelector('.entry-table-wrap');
    const prevScroll = prevWrap ? prevWrap.scrollTop : 0;
    const today = todayStr();

    let html = '<div class="entry-table-wrap"><table class="entry-table">';
    html += '<colgroup><col style="width:44px">';
    columns.forEach(() => { html += '<col>'; });
    html += '<col style="width:60px"></colgroup>';
    html += '<thead><tr>';
    html += '<th>No.</th>';
    columns.forEach(col => { html += `<th>${col.label}</th>`; });
    html += '<th>Revision</th></tr></thead><tbody>';

    let rowNo = 0;
    entries.forEach((entry, idx) => {
      if(!entryMatchesSearch(entry)) return;
      rowNo++;   // No. counts from 1 among the rows shown
      const changedKeys = (entry.revisedOn === today && Array.isArray(entry.changed)) ? entry.changed : [];
      const rowCls = entry.cancelled ? ' class="cancelled"' : '';
      html += `<tr${rowCls}>`;
      html += `<td>${rowNo}</td>`;
      columns.forEach(col => {
        const cellCls = changedKeys.includes(col.key) ? ' class="changed"' : '';
        const shown = (col.key === 'from' || col.key === 'to') ? fmtYmdSlash(entry[col.key]) : (entry[col.key] || '');
        const tip = shown ? ` title="${escapeHtml(shown).replace(/"/g, '&quot;')}"` : '';
        html += `<td${cellCls}><div class="cell-text"${tip}>${escapeHtml(shown)}</div></td>`;
      });
      html += '<td><div class="row-actions">';
      html += `<button class="row-delete" data-action="delete" data-id="${entry.id}" type="button" aria-label="Delete entry ${idx + 1}">×</button>`;
      html += `<button class="row-edit" data-action="edit" data-id="${entry.id}" type="button" aria-label="Revise entry ${idx + 1}">${PENCIL_SVG}</button>`;
      html += '</div></td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    entryListContainer.innerHTML = html;

    const newWrap = entryListContainer.querySelector('.entry-table-wrap');
    if(newWrap) newWrap.scrollTop = prevScroll;
  }

  // Revised-row highlight ends at 23:59 of the update day: re-render right after midnight
  function scheduleMidnightRefresh(){
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
    setTimeout(() => {
      renderEntryList();
      scheduleMidnightRefresh();
    }, next - now + 50);
  }
  scheduleMidnightRefresh();
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) renderEntryList();
  });

  // Confirm dialog (Yes / No)
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMessage = document.getElementById('confirmMessage');
  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');
  let pendingAction = null;

  function openConfirm(message, onYes){
    pendingAction = onYes;
    confirmMessage.textContent = message;
    confirmOverlay.hidden = false;
    confirmNo.focus();
  }

  function closeConfirm(){
    confirmOverlay.hidden = true;
    pendingAction = null;
  }

  confirmYes.addEventListener('click', () => {
    const action = pendingAction;
    closeConfirm();
    if(action) action();
  });
  confirmNo.addEventListener('click', closeConfirm);
  confirmOverlay.addEventListener('click', (e) => {
    if(e.target === confirmOverlay) closeConfirm();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && !confirmOverlay.hidden) closeConfirm();
  });

  // Revise mode
  const revisingNote = document.getElementById('revisingNote');
  const revisingText = document.getElementById('revisingText');

  function resetForm(){
    document.getElementById('fromDate').value = '';
    document.getElementById('toDate').value = '';
    document.getElementById('visitorName').value = '';
    document.getElementById('companyBuyer').value = '';
    document.getElementById('purpose').value = '';
    document.getElementById('remark').value = '';
    document.getElementById('factoryDept').value = '';
    document.getElementById('usvStaff').value = '';
    document.getElementById('foreignerManager').value = '';
    timeInputEl.value = '';
    ampmSelectEl.value = 'AM';
  }

  function exitReviseMode(){
    editingId = null;
    revisingNote.hidden = true;
    revisingText.textContent = '';
  }

  function loadEntryIntoForm(entry){
    document.getElementById('fromDate').value = entry.from || '';
    document.getElementById('toDate').value = entry.to || '';
    const m = /^(\d{2}:\d{2})\s*(AM|PM)$/.exec(entry.time || '');
    timeInputEl.value = m ? m[1] : '';
    ampmSelectEl.value = m ? m[2] : 'AM';
    document.getElementById('visitorName').value = entry.visitorName || '';
    document.getElementById('companyBuyer').value = entry.companyBuyer || '';
    document.getElementById('factoryDept').value = entry.factoryDept || '';
    document.getElementById('usvStaff').value = entry.usvStaff || '';
    document.getElementById('foreignerManager').value = entry.foreignerManager || '';
    document.getElementById('purpose').value = entry.purpose || '';
    document.getElementById('remark').value = entry.remark || '';
  }

  function startRevise(id){
    const idx = entries.findIndex(e => e.id === id);
    if(idx < 0) return;
    editingId = id;
    loadEntryIntoForm(entries[idx]);
    const shownNo = entries.filter(entryMatchesSearch).findIndex(e => e.id === id) + 1;
    revisingText.textContent = `Revising No. ${shownNo || idx + 1}`;
    revisingNote.hidden = false;
    entryBlockEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    document.getElementById('visitorName').focus();
  }

  document.getElementById('revisingCancel').addEventListener('click', () => {
    exitReviseMode();
    resetForm();
  });

  // Row actions (delete / revise) with confirmation
  entryListContainer.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if(!btn) return;
    const id = Number(btn.dataset.id);
    if(id < 0){
      showToast('This row is still being saved. Please try again in a moment.');
      return;
    }

    if(btn.dataset.action === 'delete'){
      openConfirm('Are you sure to delete?', async () => {
        try{
          await store.remove(id);
          const idx = entries.findIndex(en => en.id === id);
          if(idx >= 0) entries.splice(idx, 1);
          if(editingId === id){
            exitReviseMode();
            resetForm();
          }
          renderEntryList();
          refreshSummary(true);
        }catch(err){
          showToast('Could not delete: ' + err.message, true);
        }
      });
    } else if(btn.dataset.action === 'edit'){
      openConfirm('Are you sure to revise?', () => startRevise(id));
    }
  });

  // ===== Backend =====
  // Google Apps Script web app (Google Sheet as database). Leave API_URL empty to test locally (browser storage only).
  const API_URL = '';    // e.g. 'https://script.google.com/macros/s/XXXXXXXX/exec'
  const API_TOKEN = '';  // optional; must equal TOKEN in Code.gs

  let toastTimer = null;
  function showToast(msg, isError){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (isError ? ' error' : '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, isError ? 6000 : 2500);
  }

  async function apiCall(method, payload){
    let res;
    if(method === 'GET'){
      const qs = new URLSearchParams({ action: 'list', token: API_TOKEN });
      res = await fetch(API_URL + '?' + qs.toString());
    } else {
      // text/plain keeps this a "simple" request (no CORS preflight, which Apps Script does not answer)
      res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ token: API_TOKEN }, payload))
      });
    }
    const json = await res.json();
    if(!json.ok) throw new Error(json.error || 'Request failed');
    return json;
  }

  // Local fallback (used only when API_URL is empty)
  const STORAGE_KEY = 'qa_visitor_information_entries_v1';
  function localRead(){
    try{
      const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return Array.isArray(d.entries) ? d.entries : [];
    }catch(e){ return []; }
  }
  function localWrite(list){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ entries: list })); }catch(e){}
  }

  const store = {
    async list(){
      if(API_URL) return (await apiCall('GET')).entries;
      return localRead();
    },
    async add(data){
      if(API_URL) return (await apiCall('POST', { action: 'add', entry: data })).entry;
      const list = localRead();
      const entry = Object.assign({ id: list.reduce((m, e) => Math.max(m, Number(e.id) || 0), 0) + 1 }, data);
      list.push(entry); localWrite(list);
      return entry;
    },
    async update(entry){
      if(API_URL) return (await apiCall('POST', { action: 'update', entry: entry })).entry;
      const list = localRead(), i = list.findIndex(e => e.id === entry.id);
      if(i >= 0){ list[i] = entry; localWrite(list); }
      return entry;
    },
    async remove(id){
      if(API_URL){ await apiCall('POST', { action: 'delete', id: id }); return; }
      localWrite(localRead().filter(e => e.id !== id));
    }
  };

  let pendingSaves = 0;   // background saves in progress
  let tempIdSeq = 0;      // temporary (negative) ids for rows not yet confirmed by the backend

  async function reloadEntries(silent){
    try{
      const list = await store.list();
      if(pendingSaves > 0) return;   // do not overwrite rows that are still being saved
      entries.length = 0;
      list.forEach(e => entries.push(e));
      if(editingId !== null && !entries.some(e => e.id === editingId)){
        exitReviseMode();
        resetForm();
      }
      renderEntryList();
      refreshSummary(true);
    }catch(err){
      if(!silent){
        entryListContainer.innerHTML = '<div class="entry-list-empty">Could not load data.</div>';
        showToast('Could not load data: ' + err.message, true);
      }
    }
  }

  function isCancelRemark(text){
    return String(text || '').trim().toLowerCase() === 'cancel';
  }

  entryListContainer.innerHTML = '<div class="entry-list-empty">Loading...</div>';
  reloadEntries(false);

  // Keep several users in sync: refresh when the tab is shown again and every 60 seconds
  if(API_URL){
    document.addEventListener('visibilitychange', () => { if(!document.hidden && pendingSaves === 0) reloadEntries(true); });
    setInterval(() => {
      if(document.hidden || pendingSaves > 0 || !confirmOverlay.hidden) return;
      reloadEntries(true);
    }, 60000);
  }

  // Entry List block max height = 3 x height of Entry block, +14%, -5% (the height goes to the table scroll area)
  const entryBlockEl = document.getElementById('entry-block');
  const entryListBlockEl = document.getElementById('entry-list-block');

  function updateEntryListMaxHeight(){
    const h = entryBlockEl.getBoundingClientRect().height;
    if(h > 0){
      entryListBlockEl.style.setProperty('--entry-list-max', (h * 3 * 1.14 * 0.95) + 'px');
    }
  }

  updateEntryListMaxHeight();
  if(window.ResizeObserver){
    new ResizeObserver(updateEntryListMaxHeight).observe(entryBlockEl);
  }
  window.addEventListener('resize', updateEntryListMaxHeight);

  document.getElementById('addEntryBtn').addEventListener('click', async () => {
    const visitorName = document.getElementById('visitorName').value.trim();
    if(!visitorName){
      document.getElementById('visitorName').focus();
      return;
    }

    const timeVal = timeInputEl.value ? `${timeInputEl.value} ${ampmSelectEl.value}` : '';

    const data = {
      from: document.getElementById('fromDate').value,
      to: document.getElementById('toDate').value,
      time: timeVal,
      visitorName: visitorName,
      companyBuyer: document.getElementById('companyBuyer').value.trim(),
      factoryDept: document.getElementById('factoryDept').value,
      usvStaff: document.getElementById('usvStaff').value,
      foreignerManager: document.getElementById('foreignerManager').value,
      purpose: document.getElementById('purpose').value.trim(),
      remark: document.getElementById('remark').value.trim()
    };

    const editIdx = editingId !== null ? entries.findIndex(e => e.id === editingId) : -1;
    const refreshViews = () => { renderEntryList(); refreshSummary(true); };
    let shown;

    // The row appears in Entry List immediately; saving to the backend continues in the background
    if(editIdx >= 0){
      const old = entries[editIdx];
      const today = todayStr();
      // Cells whose value changed; accumulate if the row is revised again on the same day
      const changed = (old.revisedOn === today && Array.isArray(old.changed)) ? old.changed.slice() : [];
      columns.forEach(col => {
        if((old[col.key] || '') !== (data[col.key] || '') && !changed.includes(col.key)){
          changed.push(col.key);
        }
      });
      const updated = Object.assign({
        id: editingId,
        revisedOn: today,
        changed: changed,
        cancelled: isCancelRemark(data.remark)
      }, data);
      entries[editIdx] = updated;
      shown = updated;
      pendingSaves++;
      store.update(updated).then(saved => {
        const i = entries.findIndex(e => e.id === saved.id);
        if(i >= 0) entries[i] = saved;
        refreshViews();
      }).catch(err => {
        const i = entries.findIndex(e => e.id === updated.id);
        if(i >= 0) entries[i] = old;
        refreshViews();
        showToast('Could not save the revision (rolled back): ' + err.message, true);
      }).finally(() => { pendingSaves--; });
    } else {
      const tempId = --tempIdSeq;
      const temp = Object.assign({ id: tempId }, data);
      entries.push(temp);
      shown = temp;
      pendingSaves++;
      store.add(data).then(saved => {
        const i = entries.findIndex(e => e.id === tempId);
        if(i >= 0) entries[i] = saved; else entries.push(saved);
        refreshViews();
      }).catch(err => {
        const i = entries.findIndex(e => e.id === tempId);
        if(i >= 0) entries.splice(i, 1);
        refreshViews();
        // give the typed data back if the form is still empty, so nothing has to be retyped
        if(editingId === null && !document.getElementById('visitorName').value) loadEntryIntoForm(data);
        showToast('Could not save to Google Sheet. The row was removed, please add it again: ' + err.message, true);
      }).finally(() => { pendingSaves--; });
    }

    exitReviseMode();
    refreshViews();
    resetForm();
    if(!entryMatchesSearch(shown)) showToast('Added. This row is hidden by the current search.');
  });

  // Export to Excel via the platform's downloads capability

  // ---- Excel export based on the QA_Visitor_Information_Status.xlsx template ----
  function base64ToArrayBuffer(b64){
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  function cloneStyle(style){
    return JSON.parse(JSON.stringify(style || {}));
  }

  // 'yyyy-mm-dd' -> Date at UTC midnight (Excel date serial), or null
  function dateToExcel(str){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
    return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
  }

  // 'hh:mm AM' -> fraction of a day (Excel time), or null
  function timeToExcel(str){
    const m = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec(str || '');
    if(!m) return null;
    let h = +m[1] % 12;
    if(m[3].toUpperCase() === 'PM') h += 12;
    return (h * 60 + (+m[2])) / 1440;
  }

  // Sheet name like the template ("9.21~9.26"): Monday ~ Saturday of the current week
  function weekSheetName(){
    const now = new Date();
    const back = (now.getDay() + 6) % 7;            // days since Monday (Sunday counts as the end of the week)
    const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back);
    const sat = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 5);
    const fmt = d => `${d.getMonth() + 1}.${d.getDate()}`;
    return `${fmt(mon)}~${fmt(sat)}`;
  }

  async function buildWorkbook(){
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(base64ToArrayBuffer(TEMPLATE_XLSX_BASE64));
    const ws = wb.worksheets[0];

    // Export only the rows that match the current Entry List search (From / To, Team, Factory/Dept)
    const rows = entries.filter(entryMatchesSearch);

    const FIRST_ROW = 5, FIRST_COL = 2, LAST_COL = 15;

    // Capture template styles: data row (row 5) and the note under the table (B7)
    const rowStyles = [];
    for(let c = FIRST_COL; c <= LAST_COL; c++){
      rowStyles[c] = cloneStyle(ws.getRow(FIRST_ROW).getCell(c).style);
    }
    const dataRowHeight = ws.getRow(FIRST_ROW).height;
    const noteCell = ws.getCell('B7');
    const noteText = noteCell.value;
    const noteStyle = cloneStyle(noteCell.style);
    const noteHeight = ws.getRow(7).height;

    // Remove the note from its template position; it is re-added below the data
    noteCell.value = null;
    noteCell.style = {};
    ws.getRow(7).height = undefined;

    // Excel column of each editable field (for the "changed today" highlight, same as the Entry List)
    const COL_OF_KEY = { from: 3, to: 4, time: 5, visitorName: 6, companyBuyer: 7, factoryDept: 11,
                         usvStaff: 12, foreignerManager: 13, purpose: 14, remark: 15 };
    const todayKey = todayStr();

    rows.forEach((entry, i) => {
      const row = ws.getRow(FIRST_ROW + i);
      row.height = dataRowHeight;
      const values = {
        2: i + 1,
        3: dateToExcel(entry.from),
        4: dateToExcel(entry.to),
        5: timeToExcel(entry.time),
        6: entry.visitorName,
        7: entry.companyBuyer,
        8: '-',   // Date of Birth
        9: '-',   // ID Number
        10: '-',  // ID Issuance Place
        11: entry.factoryDept,
        12: entry.usvStaff,
        13: entry.foreignerManager,
        14: entry.purpose,
        15: entry.remark
      };
      for(let c = FIRST_COL; c <= LAST_COL; c++){
        const cell = row.getCell(c);
        cell.style = cloneStyle(rowStyles[c]);
        const v = values[c];
        cell.value = (v === '' || v === undefined) ? null : v;
        // Cancelled row: strike through data cells (not the No. column), grey text like the Entry List
        if(entry.cancelled && c > FIRST_COL){
          cell.font = Object.assign({}, cell.font, { strike: true, color: { argb: 'FF5C6670' } });
        }
      }
      // Cells changed by a revision today: light green fill, like the Entry List
      if(entry.revisedOn === todayKey && Array.isArray(entry.changed)){
        entry.changed.forEach(key => {
          const c = COL_OF_KEY[key];
          if(c) row.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDDF1E4' } };
        });
      }
    });

    const lastDataRow = FIRST_ROW + rows.length - 1;
    const noteRow = ws.getRow(lastDataRow + 2);
    noteRow.height = noteHeight;
    const nc = noteRow.getCell(FIRST_COL);
    nc.value = noteText;
    nc.style = noteStyle;

    // Rename sheet to the current week and keep the print area pointing to the table
    ws.name = weekSheetName();
    ws.pageSetup.printArea = `B$2:O$${lastDataRow}`;
    // The template's hidden filter name points at the old sheet name; the sheet's own autoFilter stays
    wb.definedNames.model = wb.definedNames.model.filter(d => d.name !== '_xlnm._FilterDatabase');

    return wb.xlsx.writeBuffer();
  }

  document.getElementById('exportBtn').addEventListener('click', async () => {
    if(entries.length === 0){
      alert('No entries to export yet.');
      return;
    }
    if(!entries.some(entryMatchesSearch)){
      alert('No entries match the current search, so there is nothing to export.');
      return;
    }

    let arrayBuffer;
    try{
      arrayBuffer = await buildWorkbook();
    }catch(err){
      alert('Could not build the Excel file: ' + (err && err.message ? err.message : 'unknown error'));
      return;
    }
    const filename = `QA_Visitor_Information_${new Date().toISOString().slice(0,10)}.xlsx`;

    const api = await getDownloadsApi();
    if(api){
      const blob = new Blob([arrayBuffer], { type: 'application/octet-stream' });
      try{
        await api.save({ filename, data: blob });
      }catch(err){
        if(err && err.code === 'declined') return;
        alert('Could not save the file: ' + (err && err.message ? err.message : 'unknown error'));
      }
      return;
    }

    // Standalone fallback: file opened directly in a browser (e.g. downloaded to disk)
    const blob = new Blob([arrayBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  // ===== Summary tab: visits by buyer =====
  // Bar order (left to right)
  const BUYERS = [
    { name: 'A&F',       color: '#16867A' },
    { name: 'AEO',       color: '#7B5EA7' },
    { name: 'CostCo',    color: '#1B3A63' },
    { name: 'Cotton On', color: '#E67E22' },
    { name: 'Pink',      color: '#D6558F' },
    { name: 'Target',    color: '#C0392B' },
    { name: 'Wal-Mart',  color: '#2F80C4' },
    { name: 'F6 Uniqlo', color: '#B8860B' },
    { name: 'F7 Uniqlo', color: '#6B7B8C' },
    { name: 'Office',    color: '#1E8E5A' }
  ];

  // USV Staff In Charge -> Buyer
  const STAFF_TO_BUYER_RAW = {
    'Jenny-Trúc (7690)': 'CostCo',
    'Jessica-Ly (7728)': 'Target',
    'Kayla-Vân (-)': 'Pink',
    'Sunshine-Thảo (-)': 'Cotton On',
    'Sky-Huyền (7758)': 'A&F',
    'Mini-Tú (7758)': 'Wal-Mart',
    'Hari-Trúc (7783)': 'Wal-Mart',
    'Lan (-)': 'Wal-Mart',
    'Mint-Hạ (7758)': 'AEO',
    'Amber-Hà (5841)': 'F6 Uniqlo',
    'Peony-Châu (5876)': 'F7 Uniqlo',
    'Tham-Thắm (7726)': 'Office',
    'Charlie-Hiếu (7734)': 'Office'
  };
  const normKey = s => String(s || '').normalize('NFC').replace(/\s+/g, '').toLowerCase();
  const STAFF_TO_BUYER = {};
  Object.keys(STAFF_TO_BUYER_RAW).forEach(k => { STAFF_TO_BUYER[normKey(k)] = STAFF_TO_BUYER_RAW[k]; });

  const weekSelect = document.getElementById('weekSelect');
  const monthSelect = document.getElementById('monthSelect');
  const weekYearSelect = document.getElementById('weekYearSelect');
  const monthYearSelect = document.getElementById('monthYearSelect');
  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function parseYmd(s){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function mondayOf(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }

  // Every calendar day covered by an entry (From..To)
  function visitDays(entry){
    const start = parseYmd(entry.from);
    if(!start) return [];
    let end = parseYmd(entry.to) || start;
    if(end < start) end = start;
    const days = [];
    for(let d = new Date(start); d <= end && days.length < 400; d = addDays(d, 1)) days.push(ymd(d));
    return days;
  }

  // 1 visit = 1 Company/ Buyer on 1 day, counted per buyer. Cancelled rows are ignored.
  function computeVisits(inRange){
    const counts = {};
    BUYERS.forEach(b => { counts[b.name] = 0; });
    const seen = new Set(), seenUnmapped = new Set();
    entries.forEach(e => {
      if(e.cancelled) return;
      const buyer = STAFF_TO_BUYER[normKey(e.usvStaff)];
      const company = String(e.companyBuyer || '').trim().toLowerCase();
      visitDays(e).forEach(day => {
        if(!inRange(day)) return;
        if(!buyer){ seenUnmapped.add(day + '|' + company); return; }
        const key = buyer + '|' + day + '|' + company;
        if(seen.has(key)) return;
        seen.add(key);
        counts[buyer]++;
      });
    });
    return { counts: counts, unmapped: seenUnmapped.size, total: BUYERS.reduce((t, b) => t + counts[b.name], 0) };
  }

  // Y-axis step: always more than 1 unit, so the axis stays sparse
  function niceStep(max){
    if(max <= 8) return 2;
    if(max <= 20) return 5;
    if(max <= 40) return 10;
    if(max <= 100) return 20;
    return Math.ceil(max / 5 / 50) * 50;
  }

  function fmtPct(frac){
    const p = Math.round(frac * 1000) / 10;
    return p % 1 === 0 ? p.toFixed(0) : p.toFixed(1);
  }

  function barChartHtml(counts){
    const W = 560, H = 274, L = 34, R = 12, T = 22, B = 48;
    const pw = W - L - R, ph = H - T - B;
    const vals = BUYERS.map(b => counts[b.name]);
    const max = Math.max(1, ...vals);
    const step = niceStep(max), yMax = Math.ceil(max / step) * step;
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visits by buyer">`;
    for(let v = 0; v <= yMax; v += step){
      const y = T + ph - (v / yMax) * ph;
      svg += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${v === 0 ? '#9AA3AD' : '#E3E6EA'}"/>`;
      svg += `<text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="10.5" fill="#5C6670">${v}</text>`;
    }
    const band = pw / BUYERS.length, bw = Math.min(32, band * 0.62);
    BUYERS.forEach((b, i) => {
      const v = counts[b.name], cx = L + band * i + band / 2, h = (v / yMax) * ph, y = T + ph - h;
      if(v > 0){
        svg += `<rect x="${cx - bw / 2}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${b.color}"><title>${escapeHtml(b.name)}: ${v} visit(s)</title></rect>`;
        svg += `<text x="${cx}" y="${y - 5}" text-anchor="middle" font-size="11" font-weight="700" fill="#232A31">${v}</text>`;
      }
      b.name.split(' ').forEach((w, j) => {
        svg += `<text x="${cx}" y="${T + ph + 16 + j * 13}" text-anchor="middle" font-size="10.5" fill="#232A31">${escapeHtml(w)}</text>`;
      });
    });
    // Average line: mean visits across the buyers shown, dashed black, label "Avg <rounded integer>"
    const sum = vals.reduce((t, v) => t + v, 0);
    if(sum > 0){
      const avg = sum / BUYERS.length;
      const ay = T + ph - (avg / yMax) * ph;
      svg += `<line x1="${L}" x2="${W - R}" y1="${ay}" y2="${ay}" stroke="#000" stroke-width="1.2" stroke-dasharray="5 4"/>`;
      svg += `<text x="${W - R - 2}" y="${ay - 5}" text-anchor="end" font-size="11" font-weight="700" fill="#000" stroke="#fff" stroke-width="3" paint-order="stroke">Avg ${Math.round(avg)}</text>`;
    }
    return svg + '</svg>';
  }

  function pieChartHtml(counts, total){
    if(total === 0) return '<div class="chart-empty">No visits in this period.</div>';
    const items = BUYERS.filter(b => counts[b.name] > 0);
    const W = 440, H = 250, CX = 220, CY = 125, R = 88, GAP = 14;
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of visits by buyer">`;
    let angle = -Math.PI / 2;
    const labels = [];
    items.forEach(b => {
      const v = counts[b.name], frac = v / total, pct = fmtPct(frac);
      const tip = `<title>${escapeHtml(b.name)}: ${v} visit(s) (${pct}%)</title>`;
      const mid = angle + frac * Math.PI;
      const a2 = angle + frac * 2 * Math.PI;
      if(items.length === 1){
        svg += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="${b.color}">${tip}</circle>`;
      } else {
        const x1 = CX + R * Math.cos(angle), y1 = CY + R * Math.sin(angle);
        const x2 = CX + R * Math.cos(a2), y2 = CY + R * Math.sin(a2);
        svg += `<path d="M${CX} ${CY} L${x1} ${y1} A${R} ${R} 0 ${frac > 0.5 ? 1 : 0} 1 ${x2} ${y2} Z" fill="${b.color}" stroke="#fff" stroke-width="1.5">${tip}</path>`;
      }
      if(frac >= 0.03 || items.length === 1){
        const r = items.length === 1 ? 0 : R * 0.68;
        svg += `<text x="${CX + r * Math.cos(mid)}" y="${CY + r * Math.sin(mid) + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${pct}%</text>`;
      }
      labels.push({ b: b, cos: Math.cos(mid), sin: Math.sin(mid) });
      angle = a2;
    });

    // Buyer names outside the pie, with leader lines; spread apart so they do not overlap
    const sides = { right: [], left: [] };
    labels.forEach(l => {
      l.sx = CX + R * l.cos; l.sy = CY + R * l.sin;
      l.ex = CX + (R + 12) * l.cos; l.ey = CY + (R + 12) * l.sin;
      l.ly = l.ey;
      (l.cos >= 0 ? sides.right : sides.left).push(l);
    });
    Object.keys(sides).forEach(k => {
      const arr = sides[k].sort((a, b) => a.ly - b.ly);
      for(let i = 1; i < arr.length; i++){
        if(arr[i].ly < arr[i - 1].ly + GAP) arr[i].ly = arr[i - 1].ly + GAP;
      }
      if(arr.length){
        const over = arr[arr.length - 1].ly - (H - 8);
        if(over > 0) arr.forEach(l => { l.ly -= over; });
      }
    });
    labels.forEach(l => {
      const dir = l.cos >= 0 ? 1 : -1, lx = CX + dir * (R + 30);
      svg += `<polyline points="${l.sx},${l.sy} ${l.ex},${l.ey} ${lx},${l.ly}" fill="none" stroke="${l.b.color}" stroke-width="1"/>`;
      svg += `<text x="${lx + dir * 4}" y="${l.ly + 4}" text-anchor="${dir > 0 ? 'start' : 'end'}" font-size="11.5" fill="${l.b.color}">${escapeHtml(l.b.name)}</text>`;
    });
    return `<div class="pie-wrap">${svg}</svg></div>`;
  }

  function fillSelect(sel, options, preferred){
    const prev = sel.value;
    sel.innerHTML = options.map(o => `<option value="${o.value}">${escapeHtml(o.label)}</option>`).join('');
    const want = options.some(o => o.value === prev) ? prev : preferred;
    sel.value = options.some(o => o.value === want) ? want : options[0].value;
  }

  // Year dropdown: years found in the data (plus the current year); "All" on top when there are 2+ years
  function populateYearSelect(sel){
    const cur = new Date().getFullYear();
    const years = new Set([cur]);
    entries.forEach(e => [e.from, e.to].forEach(str => { const d = parseYmd(str); if(d) years.add(d.getFullYear()); }));
    const list = Array.from(years).sort((a, b) => b - a).map(y => ({ value: String(y), label: String(y) }));
    if(list.length >= 2) list.unshift({ value: 'all', label: 'All' });
    fillSelect(sel, list, String(cur));
  }

  // Weeks (Mon-Sat) that touch the chosen year; every year when "All"
  function populateWeekSelect(){
    const cur = new Date().getFullYear();
    const yv = weekYearSelect.value;
    const yearList = yv === 'all'
      ? Array.from(weekYearSelect.options).map(o => +o.value).filter(n => !isNaN(n))
      : [+yv];
    const mondays = new Map();
    yearList.forEach(y => {
      let m = mondayOf(new Date(y, 0, 1));
      if(addDays(m, 5) < new Date(y, 0, 1)) m = addDays(m, 7);
      const last = mondayOf(new Date(y, 11, 31));
      for(; m <= last; m = addDays(m, 7)) mondays.set(ymd(m), new Date(m));
    });
    const opts = Array.from(mondays.values()).sort((a, b) => b - a).map(m => {
      const sat = addDays(m, 5);
      return { value: ymd(m), label: `${m.getMonth() + 1}.${m.getDate()}~${sat.getMonth() + 1}.${sat.getDate()}` };
    });
    fillSelect(weekSelect, opts, ymd(mondayOf(new Date())));
  }

  function populateMonthSelect(){
    const opts = [{ value: 'all', label: 'All' }].concat(MONTH_NAMES.map((n, i) => ({ value: String(i + 1), label: n })));
    fillSelect(monthSelect, opts, String(new Date().getMonth() + 1));
  }

  function drawSummaryRow(prefix, result){
    document.getElementById(prefix + 'BarTitle').innerHTML = `Visit - <span class="chart-total">Total: ${result.total}</span>`;
    document.getElementById(prefix + 'Bar').innerHTML = barChartHtml(result.counts);
    document.getElementById(prefix + 'Pie').innerHTML = pieChartHtml(result.counts, result.total);
    document.getElementById(prefix + 'Note').textContent = result.unmapped > 0
      ? `${result.unmapped} visit(s) without a USV Staff In Charge mapped to a buyer are not shown.` : '';
  }

  function refreshSummary(rebuildOptions){
    if(rebuildOptions){
      populateYearSelect(weekYearSelect);
      populateYearSelect(monthYearSelect);
      populateWeekSelect();
      populateMonthSelect();
    }
    const mon = parseYmd(weekSelect.value) || mondayOf(new Date());
    const from = ymd(mon), to = ymd(addDays(mon, 5));
    drawSummaryRow('week', computeVisits(d => d >= from && d <= to));

    const my = monthYearSelect.value, mm = monthSelect.value;
    drawSummaryRow('month', computeVisits(d =>
      (my === 'all' || d.slice(0, 4) === my) && (mm === 'all' || +d.slice(5, 7) === +mm)));
  }

  // Team filter (Entry List) uses the same buyer/team list as the Summary tab
  searchTeam.innerHTML = '<option value="">All</option>' + BUYERS.map(b => `<option>${escapeHtml(b.name)}</option>`).join('');

  weekYearSelect.addEventListener('change', () => { populateWeekSelect(); refreshSummary(false); });
  weekSelect.addEventListener('change', () => refreshSummary(false));
  monthYearSelect.addEventListener('change', () => refreshSummary(false));
  monthSelect.addEventListener('change', () => refreshSummary(false));
  refreshSummary(true);
</script>
